name: Build Boards

on:
  push:
    branches:
      - main
      - ci/* # for ci test
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  prepare:
    name: Determine variants to build
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0.2
    outputs:
      variants: ${{ steps.select.outputs.variants }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Test build tooling
        run: python -m unittest discover -s scripts/tests -v

      - id: select
        name: Select variants based on changes
        shell: bash
        run: |
          EVENT_NAME="${{ github.event_name }}"

          # push 到 main 分支，编译全部变体
          if [[ "$EVENT_NAME" == "push" ]]; then
            # 只构建 bread-compact-wifi（XMC 修复测试）
            printf 'variants=[{"board":"bread-compact-wifi","name":"bread-compact-wifi","full_name":"bread-compact-wifi"}]\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # pull_request 场景
          # actions/checkout checks out GitHub's synthetic PR merge commit. Its
          # first and second parents are the exact base and head commits used
          # for this run, even when the event SHAs are not exposed as refs in
          # the job container.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BASE_SHA="HEAD^1"
          HEAD_SHA="HEAD^2"
          echo "Base: $(git rev-parse "$BASE_SHA"), Head: $(git rev-parse "$HEAD_SHA")"

          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo -e "Changed files:\n$CHANGED"

          SELECTED=$(printf '%s\n' "$CHANGED" | python scripts/build.py --select-changed)
          echo "variants=$SELECTED" >> $GITHUB_OUTPUT

  build:
    name: Build ${{ matrix.full_name }}
    needs: prepare
    if: ${{ needs.prepare.outputs.variants != '[]' }}
    strategy:
      fail-fast: false  # 单个变体失败不影响其它变体
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.variants) }}
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch IDF XMC whitelist (add mfid 0x70)
        shell: bash
        run: |
          F=$IDF_PATH/components/bootloader_support/bootloader_flash/src/bootloader_flash.c
          sed -i 's/} else if (mfid == 0x41) {/} else if (mfid == 0x41 || mfid == 0x70) {/' "$F"
          grep -n "mfid == 0x70" "$F" || echo "PATCH FAILED - file content:"
          grep -n "is_xmc_chip_strict" "$F" | head -5

      - name: Build current variant
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          python scripts/build.py ${{ matrix.board }} --name ${{ matrix.name }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi_${{ matrix.full_name }}_${{ github.sha }}
          path: build/merged-binary.bin
          if-no-files-found: error

      - name: Commit firmware back to repo
        shell: bash
        run: |
          git config user.email "pippixia-bot@example.com"
          git config user.name "pippixia-bot"
          git add build/merged-binary.bin
          git commit -m "build: xmc-fixed firmware for bread-compact-wifi" || echo "nothing to commit"
          git push origin HEAD:${{ github.ref_name }} || echo "push failed"

  esp32s31-idf61:
    name: Build ${{ matrix.full_name }} with IDF 6.1
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: espressif/esp32-s31-function-coreboard-1
            name: esp32-s31-function-coreboard-1
            full_name: espressif-esp32-s31-function-coreboard-1
          - board: espressif/esp32-s31-korvo-1
            name: esp32-s31-korvo-1
            full_name: espressif-esp32-s31-korvo-1
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ESP32-S31 variant
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          python scripts/build.py ${{ matrix.board }} --name ${{ matrix.name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi_${{ matrix.full_name }}_${{ github.sha }}
          path: build/merged-binary.bin
          if-no-files-found: error
