<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>范小贱 · 填充音试听</title>
<style>
  body { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; max-width: 640px; margin: 0 auto; padding: 24px 16px 40px; background: #faf7f2; color: #2b2b2b; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: #888; font-size: 13px; margin-bottom: 24px; }
  .item { background: #fff; border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .name { font-size: 17px; font-weight: bold; }
  .tag { display: inline-block; font-size: 12px; color: #fff; border-radius: 10px; padding: 2px 10px; margin-left: 8px; vertical-align: 2px; }
  .main { background: #0b5394; }
  .norm { background: #888; }
  .desc { color: #666; font-size: 13px; margin: 6px 0 10px; }
  audio { width: 100%; height: 36px; }
  .note { background: #fff8e1; border-left: 4px solid #f9a825; padding: 10px 14px; border-radius: 6px; font-size: 13px; color: #5d4a00; margin-top: 20px; }
</style>
</head>
<body>
  <h1>🦐 范小贱 · 填充音试听</h1>
  <div class="sub">6 个纯语气词 · 拖长+音调下行=思考感 · 无句子语义不会和回复冲突</div>

  <div class="item">
    <span class="name">嗯——</span><span class="tag main">主力</span>
    <div class="desc">音调下行 60Hz，最标准的思考语气（占约 40%）</div>
    <audio controls preload="none" src="filler_en1.mp3"></audio>
  </div>

  <div class="item">
    <span class="name">嗯嗯</span><span class="tag norm">常用</span>
    <div class="desc">拖得更长，下行 69Hz，边听边琢磨的感觉</div>
    <audio controls preload="none" src="filler_uh3.mp3"></audio>
  </div>

  <div class="item">
    <span class="name">呃……</span><span class="tag norm">常用</span>
    <div class="desc">迟疑感，下行 31Hz</div>
    <audio controls preload="none" src="filler_think2.mp3"></audio>
  </div>

  <div class="item">
    <span class="name">唔……</span><span class="tag">偶尔</span>
    <div class="desc">沉吟琢磨，下行 58Hz</div>
    <audio controls preload="none" src="filler_think4.mp3"></audio>
  </div>

  <div class="item">
    <span class="name">哦——</span><span class="tag">偶尔</span>
    <div class="desc">恍然"哦~"，下行 59Hz</div>
    <audio controls preload="none" src="filler_wait5.mp3"></audio>
  </div>

  <div class="item">
    <span class="name">嗯哼</span><span class="tag">偶尔</span>
    <div class="desc">好奇上扬（唯一上行的，换口味用）</div>
    <audio controls preload="none" src="filler_oh6.mp3"></audio>
  </div>

  <div class="note">💡 听的时候注意两点：①"嗯"是不是拖长走低的思考味（不是短促肯定的"嗯！"）② 哪个听起来最像范小贱会发出的声音。觉得哪个不对，告诉我名字，我单独重做。</div>
</body>
</html>
